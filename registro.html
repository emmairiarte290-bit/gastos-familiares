<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - Gastos Familiares</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Quicksand:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(180, 100, 140, 0.15);
      border: 1px solid rgba(240, 220, 228, 0.5);
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card .logo-icon {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .login-card h1 {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      color: var(--color-header);
      text-align: center;
      margin-bottom: 0.3rem;
    }

    .login-card .subtitle {
      text-align: center;
      color: var(--color-text-light);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .login-card .form-group {
      margin-bottom: 1.2rem;
    }

    .login-card .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: var(--color-primary-dark);
      font-size: 0.9rem;
    }

    .login-card .form-group label i {
      margin-right: 6px;
      color: var(--color-primary);
    }

    .login-card .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1.5px solid var(--color-border);
      border-radius: 14px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      font-family: "Quicksand", sans-serif;
      background: rgba(255, 255, 255, 0.7);
      color: var(--color-text);
    }

    .login-card .form-group input:hover {
      border-color: #d483a8;
      background: rgba(255, 255, 255, 0.9);
    }

    .login-card .form-group input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(212, 131, 168, 0.12);
      outline: none;
      background: #ffffff;
    }

    .login-card .btn {
      width: 100%;
      justify-content: center;
      padding: 0.9rem;
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .login-card .btn i {
      margin-right: 8px;
    }

    .login-card .register-link {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--color-text-light);
      font-size: 0.9rem;
    }

    .login-card .register-link a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .login-card .register-link a:hover {
      color: var(--color-primary-dark);
      text-decoration: underline;
    }

    .error-message {
      background: rgba(232, 132, 160, 0.1);
      color: var(--color-danger);
      padding: 0.8rem 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      display: none;
      font-size: 0.9rem;
      text-align: center;
      border: 1px solid rgba(232, 132, 160, 0.2);
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .error-message.show {
      display: flex;
    }

    .success-message {
      background: rgba(181, 160, 192, 0.1);
      color: #6a5a6a;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      display: none;
      font-size: 0.9rem;
      text-align: center;
      border: 1px solid rgba(181, 160, 192, 0.2);
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .success-message.show {
      display: flex;
    }
  </style>
</head>
<body>

  <div class="decorations">
    <span class="star">✦</span>
    <span class="star">✦</span>
    <span class="star">✦</span>
    <span class="star">✦</span>
    <span class="star">✦</span>
    <span class="star">✦</span>
    <span class="star">✦</span>
    <span class="star">✦</span>
    <span class="star">✦</span>
    <span class="star">✦</span>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="triangle"></div>
    <div class="triangle"></div>
    <div class="triangle"></div>
    <span class="heart">♥</span>
    <span class="heart">♥</span>
    <span class="heart">♥</span>
    <span class="flower">✿</span>
    <span class="flower">✿</span>
    <span class="flower">✿</span>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-icon">🌸</div>
      <h1>Crear cuenta</h1>
      <p class="subtitle">Regístrate para administrar tus gastos</p>

      <div class="error-message" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">Error al registrarse</span>
      </div>

      <div class="success-message" id="successMessage">
        <i class="fas fa-check-circle"></i>
        <span id="successText">¡Registro exitoso! Verifica tu email.</span>
      </div>

      <form id="registroForm">
        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i> Email
          </label>
          <input type="email" id="email" placeholder="tu@email.com" required />
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i> Contraseña
          </label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6" />
        </div>

        <div class="form-group">
          <label for="confirmPassword">
            <i class="fas fa-check"></i> Confirmar contraseña
          </label>
          <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required />
        </div>

        <button type="submit" class="btn btn--primary" id="btnRegistro">
          <i class="fas fa-user-plus"></i> Registrarse
        </button>
      </form>

      <div class="register-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  
  <script>
    const registroForm = document.getElementById('registroForm');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const successMessage = document.getElementById('successMessage');
    const btnRegistro = document.getElementById('btnRegistro');

    function showError(message) {
      errorMessage.classList.add('show');
      errorText.textContent = message;
      successMessage.classList.remove('show');
    }

    function showSuccess(message) {
      successMessage.classList.add('show');
      successText.textContent = message;
      errorMessage.classList.remove('show');
    }

    function hideMessages() {
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
    }

    registroForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!email || !password || !confirmPassword) {
        showError('Por favor, completa todos los campos.');
        return;
      }

      if (password.length < 6) {
        showError('La contraseña debe tener al menos 6 caracteres.');
        return;
      }

      if (password !== confirmPassword) {
        showError('Las contraseñas no coinciden.');
        return;
      }

      btnRegistro.disabled = true;
      btnRegistro.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registrando...';

      try {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password
        });

        if (error) {
          if (error.message.includes('User already registered')) {
            showError('Este email ya está registrado. Por favor, inicia sesión.');
          } else {
            showError(error.message);
          }
          btnRegistro.disabled = false;
          btnRegistro.innerHTML = '<i class="fas fa-user-plus"></i> Registrarse';
          return;
        }

        showSuccess('¡Registro exitoso! Revisa tu email para confirmar la cuenta.');
        registroForm.reset();
        btnRegistro.disabled = false;
        btnRegistro.innerHTML = '<i class="fas fa-user-plus"></i> Registrarse';

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3000);

      } catch (error) {
        console.error('Error:', error);
        showError('Error al conectar con el servidor.');
        btnRegistro.disabled = false;
        btnRegistro.innerHTML = '<i class="fas fa-user-plus"></i> Registrarse';
      }
    });

    document.querySelectorAll('#registroForm input').forEach(input => {
      input.addEventListener('input', hideMessages);
    });
  </script>
</body>
</html>
